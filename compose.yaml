services:
  web:
    build: .
    image: mis:production
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "80:80"
    environment:
      DB_HOST: postgres
      MIS_DATABASE_PASSWORD: ${MIS_DATABASE_PASSWORD:?set MIS_DATABASE_PASSWORD}
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:?set RAILS_MASTER_KEY}
      SOLID_QUEUE_IN_PUMA: "true"
    volumes:
      - storage:/rails/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:16.1-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mis_production
      POSTGRES_USER: mis
      POSTGRES_PASSWORD: ${MIS_DATABASE_PASSWORD:?set MIS_DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mis -d mis_production"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  storage:
